<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F26A1B">
<title>Reel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f1; --panel:#ffffff; --panel2:#faf8f5; --line:#e8e2da; --text:#1f1a15; --muted:#7a6f63;
  --brand:#F26A1B; --brand2:#ffe8d6; --ok:#1f9d55; --okbg:#e3f6ea; --warn:#b7791f; --warnbg:#fdf3dc; --bad:#d64545; --badbg:#fde6e6;
  --kaka:#2f6fdb; --kakabg:#e7efff; --jen:#8a3ffc; --jenbg:#f1e8ff; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --panel:#1c1a18; --panel2:#232120; --line:#33302c; --text:#f2ede7; --muted:#a39889;
  --brand2:#3a2414; --okbg:#143222; --warnbg:#3a2e12; --badbg:#3d1a1a; --kakabg:#16233d; --jenbg:#271a3d; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#121110; --panel:#1c1a18; --panel2:#232120; --line:#33302c; --text:#f2ede7; --muted:#a39889;
  --brand2:#3a2414; --okbg:#143222; --warnbg:#3a2e12; --badbg:#3d1a1a; --kakabg:#16233d; --jenbg:#271a3d; --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
.gu{font-family:"Noto Sans Gujarati",Inter,sans-serif}
a{color:var(--brand)}
button,select,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.brand{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.sp{flex:1}
main{max-width:1180px;margin:0 auto;padding:16px 16px 120px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:13px}
h2{font-size:20px;margin:0 0 4px} h3{font-size:16px;margin:0 0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 14px;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.count{background:var(--brand2);color:var(--brand);border-radius:999px;padding:0 7px;font-size:12px;font-weight:600}
.tab.on .count{background:var(--brand);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.reel{padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .12s}
.reel:hover{transform:translateY(-1px);border-color:var(--brand)}
.reel .nm{font-weight:600;word-break:break-all}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.pill.br{background:var(--brand2);color:var(--brand);border-color:transparent}
.steps{display:flex;gap:4px}
.steps i{height:5px;flex:1;border-radius:3px;background:var(--line)} .steps i.on{background:var(--brand)}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px}
/* reel view */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.st{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 6px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;position:relative}
.st b{display:block;font-size:11px;color:var(--muted);font-weight:500}
.st.on{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 25%,transparent)}
.st.done::after{content:"✓";position:absolute;top:4px;right:8px;color:var(--ok);font-size:12px}
.lines{display:flex;flex-direction:column;gap:10px}
.ln{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.av.Kaka{background:var(--kakabg);color:var(--kaka)} .av.Jenish{background:var(--jenbg);color:var(--jen)}
.bub{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.bub .who{font-size:12px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bub .who .Kaka{color:var(--kaka)} .bub .who .Jenish{color:var(--jen)}
.bub .tx{font-size:17px;margin:4px 0}
.bub .en{font-size:13px;color:var(--muted)}
.bub textarea{width:100%;border:1px solid var(--brand);border-radius:8px;padding:8px;background:var(--panel2);resize:vertical}
.cmts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.cm{display:flex;gap:8px;align-items:flex-start;background:var(--warnbg);border-radius:9px;padding:7px 9px;font-size:13px}
.cm.sent{background:var(--panel2);color:var(--muted)} .cm.done{background:var(--okbg)}
.cm .x{margin-left:auto;cursor:pointer;opacity:.6;background:none;border:0;padding:0 2px}
.acts{display:flex;gap:4px;margin-left:auto}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.two>*,.grid>*{min-width:0}
.stick{position:sticky;top:70px}
textarea.in,input.in,select.in{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
label.f span.h{font-weight:400;color:var(--muted);font-size:12px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mode{border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--panel)}
.mode.on{border-color:var(--brand);background:var(--brand2)}
.mode b{display:block;margin-bottom:3px}
pre.json{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:360px;overflow:auto;font-size:12.5px;white-space:pre-wrap;word-break:break-word;margin:0}
.drop{border:2px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer;background:var(--panel2)}
.drop.hot{border-color:var(--brand);background:var(--brand2)}
audio{width:100%}
/* review */
.viewer{background:#000;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:9/16;margin:0 auto;width:min(100%,420px,calc(66vh * 9 / 16))}
.viewer video,.viewer img{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.viewer .tc{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;padding:3px 8px;font:600 13px/1.3 ui-monospace,monospace}
.ctrl{display:flex;gap:8px;align-items:center;margin:10px auto 0;max-width:420px;flex-wrap:wrap}
.ctrl input[type=range]{flex:1;accent-color:var(--brand);min-width:120px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;scroll-snap-type:x proximity}
.strip .fr{flex:none;width:58px;cursor:pointer;border-radius:7px;overflow:hidden;border:2px solid transparent;position:relative;scroll-snap-align:center;background:#000}
.strip .fr img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.strip .fr span{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:10px;text-align:center}
.strip .fr.on{border-color:var(--brand)} .strip .fr.has::before{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--brand);z-index:2;border:1.5px solid #fff}
.fcm{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.fcm img{width:52px;border-radius:6px;aspect-ratio:9/16;object-fit:cover}
.fcm.sent{opacity:.6}
/* log */
#log{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.12);transform:translateY(calc(100% - 52px));transition:transform .2s}
#log.open{transform:none}
#log .lh{display:flex;align-items:center;gap:10px;padding:8px 16px;height:52px;cursor:pointer;max-width:1180px;margin:0 auto}
#log pre{margin:0 auto;max-width:1180px;height:46vh;overflow:auto;padding:10px 16px 20px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.run{background:var(--brand);animation:pulse 1.2s infinite} .dot.done{background:var(--ok)} .dot.failed,.dot.cancelled{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal .card{max-width:520px;width:100%;padding:18px;max-height:90vh;overflow:auto}
body.gh .local-only, body.local .gh-only{display:none}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:calc(100% - 32px);font-size:14px;white-space:pre-wrap}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv b{color:var(--muted);font-weight:500}
@media (max-width:820px){
  .two{grid-template-columns:minmax(0,1fr)} .stick{position:static}
  .modes{grid-template-columns:1fr}
  .stepper{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px} .st{font-size:11.5px;padding:8px 2px} .st b{font-size:10px}
  .bar .hide-m{display:none}
  .bub .tx{font-size:16px}
}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo">KJ</div>
  <div class="brand">Reel Studio<small>Kaka × Jenish</small></div>
  <div class="sp"></div>
  <span class="pill" id="where"></span>
  <button class="btn sm hide-m local-only" onclick="phoneLink()">📱 Phone</button>
  <button class="btn sm local-only" onclick="gitSync()" title="git pull + commit + push">⟳ Sync</button>
  <button class="btn sm gh-only" onclick="ghSetup()" title="GitHub connection">⚙</button>
  <button class="btn sm ghost" onclick="toggleTheme()" title="Theme">◐</button>
</div></header>
<main id="app"><div class="empty">Loading…</div></main>
<div id="log"><div class="lh" onclick="logEl.classList.toggle('open')"><span class="dot" id="ldot"></span><b id="ltitle">No job</b><span class="muted small" id="lsub"></span><span class="sp"></span><button class="btn sm bad" id="lcancel" style="display:none" onclick="event.stopPropagation();cancelJob()">Stop</button><span class="muted">▴</span></div><pre id="ltext"></pre></div>

<script>
const $ = s => document.querySelector(s);
const app = $('#app'), logEl = $('#log');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT = t => { t = Math.max(0, t||0); return `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`; };
const kb = n => n > 1e9 ? (n/1e9).toFixed(1)+' GB' : n > 1e6 ? (n/1e6).toFixed(1)+' MB' : Math.round(n/1e3)+' KB';
let S = {home:null, reel:null, tab:'reels', step:null, q:'', job:null, jobOff:0, edit:null, ver:null, frameMode:false};
try { S.tab = localStorage.getItem('rs_tab') || 'reels'; const th = localStorage.getItem('rs_theme'); if (th) document.documentElement.dataset.theme = th; } catch(e) {}

async function api(path, opt = {}) {
  if (GH) return ghApi(path, opt);
  const r = await fetch('/api/' + path, opt.body !== undefined && !(opt.body instanceof Blob || opt.body instanceof File)
    ? {method: opt.method || 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(opt.body)} : opt);
  const j = await r.json().catch(() => ({error: 'bad response'}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(m, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function confirmBox(title, body, okLabel = 'Confirm', danger = false) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="card"><h3>${esc(title)}</h3><div class="muted" style="white-space:pre-wrap;margin-bottom:16px">${body}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-a="0">Cancel</button><button class="btn ${danger ? 'bad' : 'p'}" data-a="1">${esc(okLabel)}</button></div></div>`;
    m.onclick = e => { const a = e.target.dataset.a; if (a !== undefined || e.target === m) { m.remove(); res(a === '1'); } };
    document.body.appendChild(m);
  });
}
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(() => toast('Copied ✓'));
  const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = 0; document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); toast('Copied ✓'); } catch(e) { toast('Copy failed: long-press the text instead'); } a.remove();
}
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'})); a.download = name; a.click(); }
function toggleTheme() { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('rs_theme', r.dataset.theme); } catch(e) {} }

// ------------------------------------------------------------ GitHub mode (GitHub Pages, Mac off)
// Same UI; reads/writes the private repo with the GitHub API and runs heavy jobs on GitHub Actions
// (.github/workflows/reel-studio.yml -> python3 Tools/studio-ui/server.py job ...). Token stays in this browser only.
const GH = location.hostname.endsWith('github.io') || new URLSearchParams(location.search).has('gh');
const G = {cfg: {}, tree: null, treeAt: 0, blobs: {}, media: {}, logs: {}};
try { G.cfg = JSON.parse(localStorage.getItem('rs_gh') || '{}'); } catch(e) {}
G.cfg.repo = G.cfg.repo || 'jemssoftech/ai-video-editor'; G.cfg.branch = G.cfg.branch || 'main';
const WF = 'reel-studio.yml';
const OPT = {modes: {auto: '1 Auto (trained engine)', ai_graphics: '2 Graphics by AI', ai_full: '3 Full by AI'},
  formats: ['duo', 'phone', 'beforeafter', 'countdown', 'chat', 'quiz', 'calculator', 'comment', 'timeline', 'news', 'solo', 'myth', 'desk', 'whiteboard'],
  subtitles: ['pop', 'highlight', 'boxed', 'underline', 'outline', 'typewriter', 'bubble'],
  models: [['', 'Default (CLI setting)'], ['opus', 'Opus'], ['sonnet', 'Sonnet'], ['haiku', 'Haiku'], ['fable', 'Fable']], efforts: ['', 'low', 'medium', 'high', 'xhigh', 'max']};
const VOICE_RE = /^(voice\.(mp3|wav|m4a)|ElevenLabs.*\.mp3)$/i;

async function gh(path, opt = {}) {
  const r = await fetch(path.startsWith('http') ? path : `https://api.github.com/repos/${G.cfg.repo}${path}`, {
    method: opt.method || (opt.body ? 'POST' : 'GET'),
    headers: {Authorization: `Bearer ${G.cfg.token}`, Accept: opt.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.body ? {'Content-Type': 'application/json'} : {})},
    body: opt.body ? JSON.stringify(opt.body) : undefined});
  if (r.status === 204) return {};
  if (!r.ok) { const j = await r.json().catch(() => ({})); const e = new Error(`GitHub ${r.status}: ${j.message || r.statusText}`); e.status = r.status; throw e; }
  return opt.raw ? r : r.json();
}
async function ghTree(force) {
  if (G.tree && !force && Date.now() - G.treeAt < 4000) return G.tree;
  const ref = await gh(`/git/ref/heads/${G.cfg.branch}`);
  const t = await gh(`/git/trees/${ref.object.sha}?recursive=1`);
  G.tree = {head: ref.object.sha, items: t.tree.filter(x => x.type === 'blob'), by: {}}; G.treeAt = Date.now();
  for (const x of G.tree.items) G.tree.by[x.path] = x;
  return G.tree;
}
function ls(dir) { const p = dir + '/'; return G.tree.items.filter(x => x.path.startsWith(p)); }
function children(dir) { const s = new Set(); for (const x of ls(dir)) s.add(x.path.slice(dir.length + 1).split('/')[0]); return [...s]; }
async function blobText(path) {
  const x = G.tree.by[path]; if (!x) return null;
  if (!(x.sha in G.blobs)) { const r = await gh(`/git/blobs/${x.sha}`, {accept: 'application/vnd.github.raw', raw: true}); G.blobs[x.sha] = await r.text(); }
  return G.blobs[x.sha];
}
async function blobJson(path) { const t = await blobText(path); try { return t ? JSON.parse(t) : null; } catch(e) { return null; } }
const b64 = s => { const u = new TextEncoder().encode(s); let b = ''; for (let i = 0; i < u.length; i += 0x8000) b += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(b); };
async function ghCommit(message, changes) {
  // changes: {path, text} | {path, base64} | {path, from} (copy an existing blob) | {path, del: true}
  for (let tries = 0; tries < 4; tries++) {
    const t = await ghTree(true), entries = [];
    for (const c of changes) {
      if (c.del) { if (t.by[c.path]) entries.push({path: c.path, mode: '100644', type: 'blob', sha: null}); continue; }
      let sha = c.from ? (t.by[c.from] || {}).sha : null;
      if (!sha) { if (c.from) continue; sha = (await gh('/git/blobs', {body: {content: c.base64 ?? b64(c.text), encoding: 'base64'}})).sha; }
      entries.push({path: c.path, mode: '100644', type: 'blob', sha});
    }
    if (!entries.length) return;
    const base = await gh(`/git/commits/${t.head}`);
    const tree = await gh('/git/trees', {body: {base_tree: base.tree.sha, tree: entries}});
    const cm = await gh('/git/commits', {body: {message: message + '\n\n(Reel Studio phone UI)', tree: tree.sha, parents: [t.head]}});
    try { await gh(`/git/refs/heads/${G.cfg.branch}`, {method: 'PATCH', body: {sha: cm.sha}}); G.treeAt = 0; return; }
    catch(e) { if (e.status !== 422) throw e; }      // someone (Actions) pushed in between: redo on the new head
  }
  throw new Error('GitHub busy, try again');
}
function rawDirOf(reel) { for (const b of ['Raw', 'Raw/_pending']) if (ls(`${b}/${reel}`).length) return `${b}/${reel}`; throw new Error('reel not found: ' + reel); }
function verList(reel) {
  const out = [];
  for (const x of ls('Exports')) { const m = x.path.slice(8).match(new RegExp(`^${reel.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}_(v(\\d+))\\.mp4$`)); if (m) out.push({name: m[1], n: +m[2], file: x.path.slice(8), size: x.size, mtime: 0, frames: ls(`Studio/${reel}/ui_frames/${m[1]}`).filter(f => f.path.endsWith('.jpg')).length}); }
  return out.sort((a, b) => a.n - b.n);
}
async function ghRuns() {
  const r = await gh(`/actions/workflows/${WF}/runs?per_page=20`);

  if (p[0] === 'approved') return `Approved Videos/${p[1]}`;

}
async function ghMedia(u) {

        <div class="row" style="margin-top:12px">${modelPick('fxm')}<button class="btn p" ${open && !R.job ? '' : 'disabled'} onclick="sendFix()">Fix ${open} with AI → v${R.versions[R.versions.length - 1].n + 1}</button></div></div>
      <div class="card pad"><h3>Approve</h3><p class="muted small" style="margin-top:0">Moves <b>${esc(v.file)}</b> (+ caption, cover) to <i>Approved Videos</i>. Raw, Studio and the other versions go to Trash, and the reel leaves the Pending list.</p>
        <div class="row"><button class="btn bad sm" onclick="discardReel()">Discard reel</button><span class="sp"></span><button class="btn ok" ${R.job ? 'disabled' : ''} onclick="approveReel()">✓ Approve ${v.name}</button></div></div>
    </div></div>`;
}
function initPlayer() {
  const vid = $('#vid'); if (!vid) return;
  const v = S.reel.versions.find(x => x.name === S.ver);
  P = {vid, v, raf: 0};
  vid.onloadedmetadata = () => { $('#seek').max = vid.duration; $('#dur').textContent = fmtT(vid.duration); };
  vid.onplay = () => { $('#pp').textContent = '❚❚'; tick(); }; vid.onpause = () => { $('#pp').textContent = '▶'; draw(); };
  vid.onended = () => { $('#pp').textContent = '▶'; };
  vid.onseeked = draw; vid.onclick = togglePlay; draw();
  const img = $('#fimg'); if (img) img.onclick = togglePlay;
}
function tick() { draw(); if (P && !P.vid.paused) P.raf = requestAnimationFrame(tick); }
let lastI = -1;
function draw() {
  if (!P) return; const t = P.vid.currentTime, i = Math.min(Math.floor(t), Math.max(0, (P.v.frames || 1) - 1));
  $('#tc').textContent = fmtT(t) + (P.v.frames ? `  ·  frame ${i + 1}` : ''); $('#seek').value = t;
  const img = $('#fimg'); if (img && i !== lastI) setMedia(img, `/media/frame/${encodeURIComponent(S.reel.reel)}/${P.v.name}/f_${String(i + 1).padStart(4, '0')}.jpg`);
  if (i !== lastI) { const s = $('#strip'); if (s) { s.querySelectorAll('.fr.on').forEach(e => e.classList.remove('on')); const f = s.querySelector(`[data-i="${i}"]`); if (f) { f.classList.add('on'); f.scrollIntoView({block: 'nearest', inline: 'center', behavior: 'smooth'}); } } }
  lastI = i;
}
function togglePlay() { if (!P) return; P.vid.paused ? P.vid.play() : P.vid.pause(); }
function pausePlay() { if (P) P.vid.pause(); }
function stepF(d) { if (!P) return; pausePlay(); seekTo(Math.max(0, Math.floor(P.vid.currentTime) + d)); }
function seekTo(t) { if (!P) return; lastI = -1; P.vid.currentTime = t; draw(); }
function stopPlayer() { if (P) { cancelAnimationFrame(P.raf); try { P.vid.pause(); } catch(e) {} } P = null; lastI = -1; }
async function addFrameCmt() {
  const t = $('#fci').value.trim(); if (!t || !P) return;
  const ts = P.vid.currentTime, i = Math.min(Math.floor(ts), Math.max(0, (P.v.frames || 1) - 1));
  await addCmt({kind: 'frame', ver: P.v.name, t: Math.round(ts * 10) / 10, frame: P.v.frames ? `f_${String(i + 1).padStart(4, '0')}.jpg` : null, text: t});
  const keep = ts; renderReel(); seekTo(keep);
}
async function makeFrames() { try { const r = await api(`reel/${encodeURIComponent(S.reel.reel)}/frames`, {body: {ver: S.ver}}); watchJob(r.job, true); S.frameMode = true; } catch(e) { toast(e.message); } }
async function sendFix() {
  const n = cmtsFor(c => c.kind === 'frame' && c.ver === S.ver && c.status === 'open').length;
  if (!await confirmBox('Fix with AI?', `${n} frame comments on ${esc(S.ver)} go to the reel-studio agent. It changes only those moments and renders the next version, then makes its 1 FPS frames.`, 'Start fix')) return;
  try { const r = await api(`reel/${encodeURIComponent(S.reel.reel)}/fix`, {body: {ver: S.ver, ai: {model: $('#fxm').value}}}); watchJob(r.job, true); await refreshReel(); } catch(e) { toast(e.message); }
}
async function approveReel() {
  if (!await confirmBox(`Approve ${S.ver}?`, `• <b>${esc(S.reel.reel)}_${esc(S.ver)}.mp4</b> → Approved Videos/\n• script-bank updated (reel_build.py done)\n• Raw/${esc(S.reel.reel)}, Studio/${esc(S.reel.reel)} and other versions → Trash\n\nYou can restore from Trash until you empty it.`, 'Approve')) return;
  try { const r = await api(`reel/${encodeURIComponent(S.reel.reel)}/approve`, {body: {ver: S.ver}}); stopPlayer(); if (r.job) { watchJob(r.job, true); toast('Approving on GitHub… (1–3 min)', 4000); } else showOutput('Approved ✓', r.msg); S.tab = 'approved'; go(''); } catch(e) { toast(e.message); }
}
async function discardReel() {
  if (!await confirmBox('Discard this reel?', 'Raw, Studio and all versions go to Trash (not approved).', 'Discard', true)) return;
  try { const r = await api(`reel/${encodeURIComponent(S.reel.reel)}/trash`, {body: {}}); if (r.job) watchJob(r.job, true); toast(r.job ? 'Discarding on GitHub…' : 'Moved to trash'); go(''); } catch(e) { toast(e.message); }
}

// ------------------------------------------------------------ job log
let jobTimer = 0;
function watchJob(id, open) {
  clearTimeout(jobTimer); S.job = {id}; S.jobOff = 0; $('#ltext').textContent = ''; if (open) logEl.classList.add('open'); pollJob();
}
async function pollJob() {
  if (!S.job) return;
  let j; try { j = await api(`job/${S.job.id}?from=${S.jobOff}`); } catch(e) { return; }
  const pre = $('#ltext'), atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
  if (j.text) { if (j.text[0] === '\f') pre.textContent = j.text.slice(1); else pre.textContent += j.text; if (atEnd) pre.scrollTop = pre.scrollHeight; }
  S.jobOff = j.offset;
  $('#ldot').className = 'dot ' + (j.status === 'running' ? 'run' : j.status);
  $('#ltitle').textContent = `${j.reel}: ${j.title}`;
  $('#lsub').textContent = `${j.status} · ${fmtT(((j.end || Date.now() / 1000) - j.start))}`;
  $('#lcancel').style.display = j.status === 'running' ? '' : 'none';
  if (j.status === 'running') jobTimer = setTimeout(pollJob, GH ? 8000 : 2000);
  else if (S.job.last !== 'done') {
    S.job.last = 'done'; toast(`${j.title}: ${j.status}`, 4000);
    if (S.reel && S.reel.reel === j.reel) {
      await refreshReel();
      const R = S.reel;
      if (j.status === 'done' && (j.kind === 'build' || j.kind === 'fix' || j.kind === 'frames') && R.versions.length) {   // new render -> straight to Review
        S.ver = R.versions[R.versions.length - 1].name; S.frameMode = false; logEl.classList.remove('open'); setStep('review');
      }
    } else if (!S.reel) loadHome();
  }
}
async function cancelJob() { if (S.job && await confirmBox('Stop this job?', 'The AI run is killed; partial files stay.', 'Stop', true)) { await api(`job/${S.job.id}/cancel`, {body: {}}); } }

// ------------------------------------------------------------ misc
async function gitSync() { if (!await confirmBox('Sync with GitHub?', 'git pull → add all → commit → push, so the Mac, phone and cloud see the same reels.', 'Sync')) return; toast('Syncing…'); try { const r = await api('git-sync', {body: {}}); showOutput('Git sync', r.msg); } catch(e) { toast(e.message); } }
async function phoneLink() {
  const h = S.home || await api('home'); const u = h.tunnel || h.phone_url;
  showOutput('Open on your phone', u ? `Same Wi-Fi:\n${h.phone_url}\n${h.tunnel ? '\nAnywhere (tunnel):\n' + h.tunnel : '\nFor 4G / outside: start the server with --tunnel (needs cloudflared).'}\n\nThe link holds your private key: share it with nobody.` : 'No network address found.');
}
document.body.classList.add(GH ? 'gh' : 'local');
$('#where').textContent = GH ? '☁ GitHub' : '💻 Mac';
route();
</script>
</body>
